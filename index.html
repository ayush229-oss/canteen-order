<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Canteen Order</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }

        /* HEADER */
        .header { background: #1a1a1a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; }
        .badge { background: #e74c3c; color: #fff; border-radius: 10px; padding: 2px 7px; font-size: 11px; }

        /* NAV */
        .nav { display: flex; background: #161616; border-bottom: 1px solid #2a2a2a; }
        .nav-btn { flex: 1; padding: 11px 4px; border: none; background: none; color: #666; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-btn.active { color: #3498db; border-bottom-color: #3498db; }

        /* PAGES */
        .page { display: none; padding: 14px 14px 90px; }
        .page.active { display: block; }

        /* SESSION AREA */
        .token-bar { background: #1a1a2e; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
        .token-label { color: #888; font-size: 13px; white-space: nowrap; }
        .token-input { flex: 1; background: #252540; border: 1px solid #334; border-radius: 7px; padding: 8px 10px; color: #fff; font-size: 16px; font-weight: 700; outline: none; }
        .token-input:focus { border-color: #3498db; }

        /* SESSION BUTTON */
        .session-btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-size: 20px; font-weight: 800; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px; }
        .session-btn.start { background: #27ae60; color: #fff; box-shadow: 0 4px 20px rgba(39,174,96,0.4); }
        .session-btn.stop  { background: #e74c3c; color: #fff; box-shadow: 0 4px 20px rgba(231,76,60,0.4); animation: pulse-red 1.2s infinite; }
        @keyframes pulse-red { 0%,100% { box-shadow: 0 4px 20px rgba(231,76,60,0.4); } 50% { box-shadow: 0 4px 36px rgba(231,76,60,0.8); } }

        /* LIVE STATUS */
        .live-box { background: #111; border-radius: 12px; padding: 14px; margin-top: 14px; min-height: 80px; display: none; }
        .live-box.show { display: block; }
        .live-status { font-size: 13px; color: #888; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #27ae60; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
        .live-heard { font-size: 22px; color: #3498db; font-style: italic; min-height: 30px; }
        .live-last  { font-size: 14px; color: #2ecc71; margin-top: 6px; min-height: 20px; }

        /* CONFIRM BOX */
        .confirm-box { background: #1e1e1e; border-radius: 14px; padding: 16px; margin-top: 12px; display: none; border: 1px solid #444; }
        .confirm-box.show { display: block; }
        .confirm-item { font-size: 19px; margin-bottom: 14px; line-height: 1.5; }
        .confirm-btns { display: flex; gap: 10px; }
        .btn { padding: 11px 16px; border-radius: 9px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; flex: 1; }
        .btn-green { background: #27ae60; color: #fff; }
        .btn-red   { background: #e74c3c; color: #fff; }
        .btn-gray  { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
        .btn-blue  { background: #3498db; color: #fff; }
        .alt-row   { margin-top: 10px; display: none; }
        .alt-label { font-size: 12px; color: #666; margin-bottom: 6px; }
        .alt-btns  { display: flex; flex-wrap: wrap; gap: 6px; }

        /* TODAY SUMMARY on order page */
        .today-strip { display: flex; gap: 8px; margin-top: 14px; }
        .today-card  { flex: 1; background: #1a1a1a; border-radius: 10px; padding: 10px 12px; text-align: center; }
        .today-card .val  { font-size: 20px; font-weight: 800; color: #2ecc71; }
        .today-card .lbl  { font-size: 11px; color: #555; margin-top: 2px; }

        /* TICKETS TAB */
        .ticket-card { background: #1a1a1a; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .ticket-head { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .ticket-token { font-size: 16px; font-weight: 700; }
        .ticket-total { font-size: 18px; font-weight: 800; color: #2ecc71; }
        .ticket-meta  { font-size: 12px; color: #666; margin-top: 2px; }
        .ticket-body  { display: none; border-top: 1px solid #2a2a2a; padding: 10px 16px; }
        .ticket-body.open { display: block; }
        .ticket-row   { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1f1f1f; font-size: 14px; }
        .ticket-row:last-child { border-bottom: none; }
        .ticket-row.cancelled { opacity: 0.4; text-decoration: line-through; }
        .ticket-price { color: #2ecc71; font-weight: 600; }
        .ticket-actions { display: flex; gap: 8px; margin-top: 10px; }

        /* LOG TAB */
        .order-item { background: #1a1a1a; border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .order-item.cancelled { opacity: 0.4; }
        .order-item.cancelled .order-name,
        .order-item.cancelled .order-price { text-decoration: line-through; }
        .order-name  { font-size: 15px; font-weight: 600; }
        .order-meta  { font-size: 12px; color: #666; margin-top: 2px; }
        .order-price { font-size: 16px; font-weight: 700; color: #2ecc71; }
        .order-del   { background: none; border: none; color: #555; font-size: 20px; cursor: pointer; padding: 2px 8px; }

        /* MENU TAB */
        .menu-item { background: #1a1a1a; border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .menu-item-name    { font-size: 15px; font-weight: 600; }
        .menu-item-price   { font-size: 13px; color: #2ecc71; margin-top: 2px; }
        .menu-item-aliases { font-size: 11px; color: #555; margin-top: 3px; }
        .menu-item-actions { display: flex; gap: 6px; }
        .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; font-size: 17px; }

        /* SETTINGS */
        .settings-row { background: #1a1a1a; border-radius: 9px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .settings-label { font-size: 14px; }
        .settings-sub   { font-size: 12px; color: #555; margin-top: 2px; }
        .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background:#333; border-radius:24px; transition:.3s; }
        .toggle-slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s; }
        input:checked + .toggle-slider { background: #3498db; }
        input:checked + .toggle-slider:before { transform: translateX(20px); }

        /* FORMS */
        .add-form   { background: #1a1a1a; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
        .form-row   { margin-bottom: 11px; }
        .form-label { font-size: 12px; color: #888; margin-bottom: 4px; display: block; }
        .form-input { width: 100%; background: #252525; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 15px; outline: none; }
        .form-input:focus { border-color: #3498db; }
        select.form-input { padding: 8px 10px; }

        /* MISC */
        .action-btn  { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; }
        .export-btn  { background:#27ae60; color:#fff; }
        .clear-btn   { background:#c0392b; color:#fff; }
        .section-title { font-size:11px; color:#555; text-transform:uppercase; letter-spacing:1px; margin:16px 0 8px; }
        .empty-state { text-align:center; color:#333; padding:50px 20px; font-size:15px; }
        .total-bar   { position:fixed; bottom:0; left:0; right:0; background:#111; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #2a2a2a; }
        .total-label { color:#777; font-size:13px; }
        .total-amount { font-size:24px; font-weight:700; color:#2ecc71; }
    </style>
</head>
<body>

<div class="header">
    <h1>🍜 Canteen</h1>
    <span id="order-badge" class="badge" style="display:none">0</span>
</div>

<div class="nav">
    <button class="nav-btn active" onclick="showPage('order')">🎤 Order</button>
    <button class="nav-btn" onclick="showPage('tickets')">🎫 Tickets</button>
    <button class="nav-btn" onclick="showPage('menu')">🍽️ Menu</button>
    <button class="nav-btn" onclick="showPage('settings')">⚙️ Settings</button>
</div>

<!-- ========== ORDER PAGE ========== -->
<div id="page-order" class="page active">

    <div class="token-bar">
        <span class="token-label">Token / Table</span>
        <input id="token-input" class="token-input" placeholder="Enter token #" type="text" />
    </div>

    <button id="session-btn" class="session-btn start" onclick="toggleSession()">▶ START SESSION</button>

    <div class="live-box" id="live-box">
        <div class="live-status"><div class="live-dot"></div><span id="live-status-text">Listening...</span></div>
        <div class="live-heard" id="live-heard"></div>
        <div class="live-last"  id="live-last"></div>
    </div>

    <div class="confirm-box" id="confirm-box">
        <div class="confirm-item" id="confirm-text"></div>
        <div class="confirm-btns">
            <button class="btn btn-green" onclick="confirmOrder(true)">✓ Add</button>
            <button class="btn btn-red"   onclick="confirmOrder(false)">✗ No</button>
        </div>
        <div class="alt-row" id="alt-row">
            <div class="alt-label">Did you mean:</div>
            <div class="alt-btns" id="alt-btns"></div>
            <button class="btn btn-gray" style="margin-top:10px;font-size:13px;" onclick="confirmToAddMenu()">+ Not listed — Add to Menu</button>
        </div>
    </div>

    <div class="today-strip">
        <div class="today-card"><div class="val" id="today-orders">0</div><div class="lbl">Orders today</div></div>
        <div class="today-card"><div class="val" id="today-tokens">0</div><div class="lbl">Tokens</div></div>
        <div class="today-card"><div class="val" id="today-total">₹0</div><div class="lbl">Revenue</div></div>
    </div>

    <div class="total-bar">
        <div>
            <div class="total-label">This Token</div>
            <div style="font-size:11px;color:#555;" id="token-count-text">—</div>
        </div>
        <div class="total-amount" id="token-total">₹0</div>
    </div>
</div>

<!-- ========== TICKETS PAGE ========== -->
<div id="page-tickets" class="page">
    <div id="tickets-empty" class="empty-state">No tickets yet</div>
    <div id="tickets-container"></div>
    <div class="total-bar">
        <div><div class="total-label">All Active</div></div>
        <div class="total-amount" id="tickets-grand-total">₹0</div>
    </div>
</div>

<!-- ========== MENU PAGE ========== -->
<div id="page-menu" class="page">
    <div class="section-title">Add Item</div>
    <div class="add-form">
        <div class="form-row">
            <label class="form-label">Item Name</label>
            <input id="new-name" class="form-input" placeholder="e.g. Maggie, Chai, Samosa" />
        </div>
        <div class="form-row" style="margin-bottom:0">
            <label class="form-label">Price (₹)</label>
            <input id="new-price" class="form-input" type="number" placeholder="e.g. 20" />
        </div>
        <button class="btn btn-blue" style="width:100%;margin-top:12px;" onclick="addMenuItem()">+ Add to Menu</button>
    </div>
    <div class="section-title">Menu Items</div>
    <div id="menu-list"></div>
</div>

<!-- ========== SETTINGS PAGE ========== -->
<div id="page-settings" class="page">
    <div class="section-title">Voice</div>

    <div class="settings-row">
        <div>
            <div class="settings-label">Voice Language</div>
            <div class="settings-sub">Hinglish recommended</div>
        </div>
        <select id="voice-lang" class="form-input" style="width:auto;" onchange="saveSettings()">
            <option value="hi-IN">Hindi / Hinglish</option>
            <option value="en-IN">English (India)</option>
        </select>
    </div>

    <div class="settings-row">
        <div>
            <div class="settings-label">Always Confirm Order</div>
            <div class="settings-sub">Slower but safer</div>
        </div>
        <label class="toggle">
            <input type="checkbox" id="toggle-confirm" onchange="saveSettings()">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div class="section-title">Data</div>
    <button class="action-btn export-btn" onclick="exportCSV()">📊 Export to Excel (CSV)</button>
    <button class="action-btn clear-btn" onclick="clearOrders()">🗑️ Clear All Orders</button>

    <div class="section-title">Learning</div>
    <div class="settings-row">
        <div>
            <div class="settings-label">Learned Voice Aliases</div>
            <div class="settings-sub" id="alias-count">0 mappings</div>
        </div>
        <button class="btn btn-gray" style="flex:0;padding:8px 14px;" onclick="clearAliases()">Reset</button>
    </div>
</div>

<script>
// ===== STATE =====
let menu     = JSON.parse(localStorage.getItem('c_menu')     || 'null');
let orders   = JSON.parse(localStorage.getItem('c_orders')   || '[]');
let aliases  = JSON.parse(localStorage.getItem('c_aliases')  || '{}');
let settings = JSON.parse(localStorage.getItem('c_settings') || '{"confirm":false,"lang":"hi-IN"}');

if (!menu) {
    menu = [
        { id:1, name:'Maggie',         price:20 },
        { id:2, name:'Chai',           price:10 },
        { id:3, name:'Coffee',         price:15 },
        { id:4, name:'Samosa',         price:10 },
        { id:5, name:'Bread Omelette', price:30 },
    ];
    saveMenu();
}

// ===== SESSION =====
let sessionActive = false;
let recognition   = null;
let pendingOrder  = null;
let restartTimer  = null;

function toggleSession() {
    if (!sessionActive) startSession();
    else stopSession();
}

function startSession() {
    const token = document.getElementById('token-input').value.trim();
    if (!token) { document.getElementById('token-input').focus(); document.getElementById('token-input').style.borderColor='#e74c3c'; setTimeout(()=>document.getElementById('token-input').style.borderColor='',1200); return; }
    sessionActive = true;
    document.getElementById('session-btn').className = 'session-btn stop';
    document.getElementById('session-btn').textContent = '⏹ STOP SESSION';
    document.getElementById('live-box').classList.add('show');
    document.getElementById('confirm-box').classList.remove('show');
    updateTokenTotal();
    startListening();
}

function stopSession() {
    sessionActive = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    clearTimeout(restartTimer);
    document.getElementById('session-btn').className = 'session-btn start';
    document.getElementById('session-btn').textContent = '▶ START SESSION';
    document.getElementById('live-box').classList.remove('show');
    document.getElementById('live-heard').textContent = '';
    document.getElementById('live-last').textContent  = '';
}

// ===== SPEECH =====
function setupSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Use Chrome for voice'); return null; }
    const r = new SR();
    r.lang = settings.lang || 'hi-IN';
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (e) => {
        let interim = '', final = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
        }
        document.getElementById('live-heard').textContent = final || interim;
        if (final) processInput(final.trim());
    };

    r.onerror = (e) => {
        if (e.error === 'aborted') return;
        if (sessionActive) restartTimer = setTimeout(startListening, 400);
    };

    r.onend = () => {
        // Auto-restart if session still active and no confirm pending
        if (sessionActive && !document.getElementById('confirm-box').classList.contains('show')) {
            restartTimer = setTimeout(startListening, 300);
        }
    };

    return r;
}

function startListening() {
    if (!sessionActive) return;
    recognition = setupSpeech();
    if (!recognition) return;
    document.getElementById('live-status-text').textContent = 'Listening...';
    try { recognition.start(); } catch(e) { restartTimer = setTimeout(startListening, 500); }
}

// ===== AUDIO =====
function playPing() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 1046; o.type = 'sine';
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        o.start(); o.stop(ctx.currentTime + 0.18);
    } catch(e){}
}
function playCancelSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 440; o.type = 'sine';
        g.gain.setValueAtTime(0.2, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        o.start(); o.stop(ctx.currentTime + 0.3);
    } catch(e){}
}

// ===== DEVANAGARI ROMANIZER =====
const DEVA = {
    'अ':'a','आ':'aa','इ':'i','ई':'ii','उ':'u','ऊ':'uu','ए':'e','ऐ':'e','ओ':'o','औ':'o','ऑ':'o',
    'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'ch','ज':'j','झ':'jh','ञ':'n',
    'ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n',
    'प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','ळ':'l',
    'श':'sh','ष':'sh','स':'s','ह':'h','क्ष':'x','त्र':'tr','ज्ञ':'gy',
    'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'e','ो':'o','ौ':'o','ॉ':'o',
    '्':'','ं':'n','ँ':'','ः':'',
    '०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9',
};
function romanize(text) {
    if (!/[ऀ-ॿ]/.test(text)) return text.toLowerCase();
    let r = '';
    for (const ch of text) r += (DEVA[ch] !== undefined ? DEVA[ch] : ch);
    return r.toLowerCase();
}

// ===== CANCEL DETECTION =====
const CANCEL_WORDS = ['remove','hatao','cancel','hata do','last hatao','wapas','delete','हटाओ','हटा दो','कैंसिल','वापस'];
function isCancelCommand(t) { return CANCEL_WORDS.some(w => t.toLowerCase().includes(w)); }

// ===== NUMBER PARSING =====
const NUM_WORDS = { ek:1,एक:1,one:1,do:2,दो:2,two:2,teen:3,तीन:3,three:3,char:4,चार:4,four:4,paanch:5,पांच:5,पाँच:5,five:5,chhe:6,six:6,saat:7,seven:7,aath:8,eight:8,nau:9,nine:9,das:10,ten:10 };
const NUM_SET  = new Set(Object.keys(NUM_WORDS));

// ===== SPLIT MULTI-ITEM =====
function splitOrders(text) {
    const words = text.trim().split(/\s+/);
    const segs = []; let cur = [];
    for (const w of words) {
        const isNum = /^\d+$/.test(w) || NUM_SET.has(w.toLowerCase());
        if (isNum && cur.length > 0) { segs.push(cur.join(' ')); cur = [w]; }
        else cur.push(w);
    }
    if (cur.length) segs.push(cur.join(' '));
    return segs.filter(s => s.trim());
}

function parseSegment(text) {
    const words = text.trim().split(/\s+/);
    const first = words[0].toLowerCase();
    let qty = 1, itemText = text.trim();
    if (!isNaN(first) && first !== '') { qty = parseInt(first); itemText = words.slice(1).join(' '); }
    else if (NUM_WORDS[first])         { qty = NUM_WORDS[first]; itemText = words.slice(1).join(' '); }
    return { qty, itemText: itemText.trim() };
}

// ===== PROCESS INPUT =====
function processInput(rawText) {
    const text = rawText.trim();
    document.getElementById('live-heard').textContent = '';

    if (isCancelCommand(text)) { cancelLastOrder(); return; }

    const segs = splitOrders(text);

    if (segs.length > 1) {
        let logged = 0, failed = [];
        segs.forEach(seg => {
            const { qty, itemText } = parseSegment(seg);
            const match = bestMatch(resolveAlias(itemText));
            if (match && match.score > 0.4) { addOrder(match, qty, itemText, true); logged++; }
            else failed.push(itemText);
        });
        const msg = `${logged} added${failed.length ? ' · not found: ' + failed.join(', ') : ''}`;
        document.getElementById('live-last').textContent = msg;
        if (logged) playPing();
        // restart is handled by onend
        return;
    }

    const { qty, itemText } = parseSegment(text);
    const match = bestMatch(resolveAlias(itemText));

    if (!match) {
        // Unknown item — ask to add to menu
        showAddMenuPrompt(itemText, qty);
        return;
    }

    pendingOrder = { item: match, qty, heardAs: itemText };

    if (!settings.confirm && match.score >= 0.6) {
        learnAlias(itemText, match.name);
        addOrder(match, qty, itemText, false);
    } else {
        showConfirm(match, qty, itemText, match.score < 0.65);
    }
}

// ===== ALIAS =====
function resolveAlias(text) {
    const t = text.toLowerCase();
    return aliases[t] || aliases[romanize(t)] || t;
}
function learnAlias(heardAs, itemName) {
    const h = heardAs.toLowerCase(), n = itemName.toLowerCase(), hr = romanize(h);
    if (h !== n && !aliases[h]) { aliases[h] = n; if (hr !== h) aliases[hr] = n; localStorage.setItem('c_aliases', JSON.stringify(aliases)); updateAliasCount(); }
}

// ===== MATCHING =====
function bestMatch(text) {
    if (!text) return null;
    const nt = romanize(text.toLowerCase());
    let best = null, top = 0;
    for (const item of menu) {
        const n = item.name.toLowerCase(), nn = romanize(n);
        let score = Math.max(jaccard(nt,nn), jaccard(text.toLowerCase(),n), jaccard(nt,n));
        if (nn.includes(nt)||nt.includes(nn)||n.includes(text.toLowerCase())||text.toLowerCase().includes(n)) score = Math.max(score,0.82);
        if (nn===nt||n===text.toLowerCase()) score = 1;
        if (score > top) { top=score; best={...item,score}; }
    }
    return top > 0.35 ? best : null;
}
function jaccard(a,b) {
    if (!a||!b) return 0; if (a===b) return 1;
    const sa=new Set(a), sb=new Set(b);
    const inter=[...sa].filter(x=>sb.has(x)).length;
    return inter/(sa.size+sb.size-inter);
}

// ===== CONFIRM UI =====
function showConfirm(item, qty, heardAs, showAlts) {
    // Pause auto-restart while confirm is open
    clearTimeout(restartTimer);
    try { if (recognition) recognition.stop(); } catch(e){}

    document.getElementById('confirm-text').innerHTML =
        `<b>${qty}× ${item.name}</b> &nbsp;₹${item.price*qty}<br><small style="color:#666">Heard: "${heardAs}"</small>`;

    const altRow = document.getElementById('alt-row');
    if (showAlts) {
        const altsDiv = document.getElementById('alt-btns'); altsDiv.innerHTML = '';
        menu.filter(m=>m.id!==item.id).slice(0,4).forEach(alt => {
            const b = document.createElement('button');
            b.className='btn btn-gray'; b.style.flex='0'; b.textContent=alt.name;
            b.onclick=()=>{ pendingOrder.item={...alt,score:1}; confirmOrder(true); };
            altsDiv.appendChild(b);
        });
        altRow.style.display='block';
    } else { altRow.style.display='none'; }

    document.getElementById('confirm-box').classList.add('show');
}

function confirmOrder(yes) {
    document.getElementById('confirm-box').classList.remove('show');
    if (!pendingOrder) return;
    if (yes) { learnAlias(pendingOrder.heardAs, pendingOrder.item.name); addOrder(pendingOrder.item, pendingOrder.qty, pendingOrder.heardAs, false); }
    else document.getElementById('live-last').textContent = 'Cancelled';
    pendingOrder = null;
    // Resume listening
    if (sessionActive) restartTimer = setTimeout(startListening, 300);
}

function confirmToAddMenu() {
    document.getElementById('confirm-box').classList.remove('show');
    if (pendingOrder) showAddMenuPrompt(pendingOrder.heardAs, pendingOrder.qty);
    pendingOrder = null;
}

// ===== ADD TO MENU PROMPT =====
function showAddMenuPrompt(itemText, qty) {
    clearTimeout(restartTimer);
    try { if (recognition) recognition.stop(); } catch(e){}

    document.getElementById('live-status-text').textContent = 'New item heard';
    document.getElementById('live-heard').textContent = itemText;

    const price = prompt(`"${itemText}" not in menu.\nAdd it? Enter price (₹) or Cancel:`);
    if (price !== null && !isNaN(parseFloat(price))) {
        const name = prompt('Item name:', itemText.charAt(0).toUpperCase()+itemText.slice(1)) || itemText;
        const newItem = { id: Date.now(), name: name.trim(), price: parseFloat(price) };
        menu.push(newItem); saveMenu();
        learnAlias(itemText, newItem.name);
        addOrder(newItem, qty, itemText, false);
        document.getElementById('live-last').textContent = `"${newItem.name}" added to menu & ordered`;
    } else {
        document.getElementById('live-status-text').textContent = 'Listening...';
    }
    if (sessionActive) restartTimer = setTimeout(startListening, 400);
}

// ===== CANCEL LAST =====
function cancelLastOrder() {
    const token = document.getElementById('token-input').value.trim();
    for (let i = orders.length-1; i >= 0; i--) {
        if (!orders[i].cancelled && (!token || orders[i].token === token)) {
            orders[i].cancelled = true;
            localStorage.setItem('c_orders', JSON.stringify(orders));
            playCancelSound();
            document.getElementById('live-last').textContent = `↩ Cancelled: ${orders[i].item}`;
            updateAll(); return;
        }
    }
    document.getElementById('live-last').textContent = 'Nothing to cancel';
}

// ===== ADD ORDER =====
function addOrder(item, qty, heardAs, silent) {
    const token = document.getElementById('token-input').value.trim();
    const now = new Date();
    orders.push({
        id:        Date.now() + Math.random(),
        item:      item.name,
        price:     item.price,
        qty,
        total:     item.price * qty,
        token,
        cancelled: false,
        time:      now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
        date:      now.toLocaleDateString('en-GB').replace(/\//g,'-'),
    });
    localStorage.setItem('c_orders', JSON.stringify(orders));
    if (!silent) {
        playPing();
        document.getElementById('live-last').textContent = `✓ ${qty}× ${item.name}  ₹${item.price*qty}`;
    } else { playPing(); }
    updateAll();
}

// ===== UPDATE ALL UI =====
function updateAll() {
    updateTodayStrip();
    updateTokenTotal();
    updateBadge();
    if (document.getElementById('page-tickets').classList.contains('active')) renderTickets();
}

function updateTodayStrip() {
    const today = new Date().toLocaleDateString('en-GB').replace(/\//g,'-');
    const todayOrders = orders.filter(o=>o.date===today && !o.cancelled);
    const tokens = new Set(todayOrders.map(o=>o.token).filter(Boolean));
    document.getElementById('today-orders').textContent = todayOrders.length;
    document.getElementById('today-tokens').textContent = tokens.size;
    document.getElementById('today-total').textContent  = '₹'+todayOrders.reduce((s,o)=>s+o.total,0);
}

function updateTokenTotal() {
    const token = document.getElementById('token-input').value.trim();
    const tokenOrders = orders.filter(o=>o.token===token && !o.cancelled);
    const total = tokenOrders.reduce((s,o)=>s+o.total,0);
    document.getElementById('token-total').textContent    = `₹${total}`;
    document.getElementById('token-count-text').textContent = token ? `Token ${token} · ${tokenOrders.length} items` : '—';
}

function updateBadge() {
    const active = orders.filter(o=>!o.cancelled).length;
    const badge = document.getElementById('order-badge');
    badge.textContent = active; badge.style.display = active ? 'inline' : 'none';
}

// ===== TICKETS =====
function renderTickets() {
    const container = document.getElementById('tickets-container');
    const empty     = document.getElementById('tickets-empty');

    // Group by token
    const tokenMap = {};
    orders.forEach(o => {
        const key = o.token || '(no token)';
        if (!tokenMap[key]) tokenMap[key] = [];
        tokenMap[key].push(o);
    });

    const keys = Object.keys(tokenMap);
    if (!keys.length) { empty.style.display='block'; container.innerHTML=''; document.getElementById('tickets-grand-total').textContent='₹0'; return; }
    empty.style.display = 'none';

    // Sort tokens numerically if possible
    keys.sort((a,b) => (!isNaN(a)&&!isNaN(b)) ? Number(a)-Number(b) : a.localeCompare(b));

    let grandTotal = 0;
    container.innerHTML = keys.map(key => {
        const items   = tokenMap[key];
        const active  = items.filter(o=>!o.cancelled);
        const total   = active.reduce((s,o)=>s+o.total,0);
        const count   = active.reduce((s,o)=>s+o.qty,0);
        grandTotal += total;
        const lastTime = items[items.length-1].time;
        const rows = items.map(o=>`
            <div class="ticket-row${o.cancelled?' cancelled':''}">
                <span>${o.qty}× ${o.item}${o.token&&o.time?` <span style="color:#444;font-size:11px;">${o.time}</span>`:''}</span>
                <span class="ticket-price">₹${o.total}</span>
            </div>`).join('');
        return `
        <div class="ticket-card">
            <div class="ticket-head" onclick="toggleTicket('t-${key.replace(/\s/g,'_')}')">
                <div>
                    <div class="ticket-token">🎫 Token ${key}</div>
                    <div class="ticket-meta">${count} items · ${lastTime}</div>
                </div>
                <div class="ticket-total">₹${total}</div>
            </div>
            <div class="ticket-body" id="t-${key.replace(/\s/g,'_')}">
                ${rows}
                <div class="ticket-actions">
                    <button class="btn btn-gray" style="font-size:13px;" onclick="setToken('${key}')">Edit This Token</button>
                    <button class="btn btn-red"  style="font-size:13px;" onclick="closeTicket('${key}')">Mark Paid ✓</button>
                </div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('tickets-grand-total').textContent = `₹${grandTotal}`;
}

function toggleTicket(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
}

function setToken(token) {
    document.getElementById('token-input').value = token;
    showPage('order');
    updateTokenTotal();
}

function closeTicket(token) {
    if (!confirm(`Mark Token ${token} as paid and remove from tickets?`)) return;
    orders = orders.filter(o => o.token !== token);
    localStorage.setItem('c_orders', JSON.stringify(orders));
    updateAll(); renderTickets();
}

// ===== MENU CRUD =====
function renderMenu() {
    const list = document.getElementById('menu-list');
    if (!menu.length) { list.innerHTML='<div class="empty-state">No items yet</div>'; return; }
    list.innerHTML = menu.map(item => {
        const learned = Object.entries(aliases).filter(([k,v])=>v===item.name.toLowerCase()).map(([k])=>k).slice(0,5);
        return `
        <div class="menu-item">
            <div style="flex:1">
                <div class="menu-item-name">${item.name}</div>
                <div class="menu-item-price">₹${item.price}</div>
                ${learned.length?`<div class="menu-item-aliases">Also hears: ${learned.join(', ')}</div>`:''}
            </div>
            <div class="menu-item-actions">
                <button class="icon-btn" onclick="editItem(${item.id})">✏️</button>
                <button class="icon-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
        </div>`;
    }).join('');
}
function addMenuItem() {
    const name=document.getElementById('new-name').value.trim(), price=parseFloat(document.getElementById('new-price').value);
    if (!name||isNaN(price)||price<0) { alert('Enter name and price'); return; }
    menu.push({id:Date.now(),name,price}); saveMenu();
    document.getElementById('new-name').value=''; document.getElementById('new-price').value=''; renderMenu();
}
function editItem(id) {
    const item=menu.find(m=>m.id===id); if(!item) return;
    const n=prompt('Item name:',item.name); if(!n) return;
    const p=parseFloat(prompt('Price (₹):',item.price)); if(isNaN(p)) return;
    item.name=n.trim(); item.price=p; saveMenu(); renderMenu();
}
function deleteItem(id) {
    if(!confirm('Delete this item?')) return;
    menu=menu.filter(m=>m.id!==id); saveMenu(); renderMenu();
}
function saveMenu() { localStorage.setItem('c_menu',JSON.stringify(menu)); }

// ===== SETTINGS =====
function saveSettings() {
    settings.confirm = document.getElementById('toggle-confirm').checked;
    settings.lang    = document.getElementById('voice-lang').value;
    localStorage.setItem('c_settings', JSON.stringify(settings));
}
function loadSettings() {
    document.getElementById('toggle-confirm').checked = !!settings.confirm;
    document.getElementById('voice-lang').value       = settings.lang || 'hi-IN';
    updateAliasCount();
}
function updateAliasCount() { document.getElementById('alias-count').textContent = `${Object.keys(aliases).length} mappings`; }
function clearAliases() { if(!confirm('Reset learned mappings?')) return; aliases={}; localStorage.setItem('c_aliases','{}'); updateAliasCount(); renderMenu(); }

// ===== EXPORT =====
function exportCSV() {
    if (!orders.length) { alert('No orders'); return; }
    const rows=[['Date','Time','Token','Item','Qty','Unit Price','Total','Status']];
    orders.forEach(o=>rows.push([o.date,o.time,o.token||'',o.item,o.qty,o.price,o.total,o.cancelled?'CANCELLED':'Active']));
    const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`canteen_${new Date().toLocaleDateString('en-GB').replace(/\//g,'-')}.csv`; a.click();
}
function clearOrders() {
    if(!confirm('Clear ALL orders?')) return;
    orders=[]; localStorage.setItem('c_orders','[]'); updateAll(); renderTickets();
}

// ===== NAV =====
function showPage(name) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('page-'+name).classList.add('active');
    document.querySelectorAll('.nav-btn')[['order','tickets','menu','settings'].indexOf(name)].classList.add('active');
    if (name==='menu')    renderMenu();
    if (name==='tickets') renderTickets();
}

// ===== INIT =====
loadSettings();
updateAll();
</script>
